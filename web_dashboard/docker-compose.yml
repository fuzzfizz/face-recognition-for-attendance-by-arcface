version: "3.8"

services:
  web_dashboard:
    image: athit0900/face-recognition-ai-web-dashboard:1.0.0
    container_name: face-recognition-ai-web-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST={DB_HOST}
      - DB_PORT={DB_PORT}
      - DB_USER={DB_USER}
      - DB_PASS={DB_PASS}
      - DB_NAME={DB_NAME}
      - AI_SERVER_URL={AI_SERVER_URL}
      - ADMIN_API_KEY={ADMIN_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
