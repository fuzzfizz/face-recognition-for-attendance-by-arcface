version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: face_attendance_db
    restart: always
    environment:
      MYSQL_DATABASE: face_attendance
      MYSQL_USER: face_admin
      MYSQL_PASSWORD: SecurePassword123!
      MYSQL_ROOT_PASSWORD: RootSecurePassword123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql

volumes:
  mysql_data:
