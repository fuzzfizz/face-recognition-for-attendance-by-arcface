version: "3.8"

services:
  face-recognition-ai:
    build: .
    image: athit0900/face-recognition-ai-server:latest
    container_name: face-recognition-ai-server
    ports:
      - "8000:8000"
    environment:
      - DB_MODE=${DB_MODE:-mysql}
      - MYSQL_URL=${MYSQL_URL:-}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/face_recognition.db}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.45}
      - MODEL_NAME=${MODEL_NAME:-buffalo_l}
      - HOST=0.0.0.0
      - PORT=8000
      - INSIGHTFACE_HOME=/app/data/.insightface
      - TRAINING_SCHEDULE_INFO=${TRAINING_SCHEDULE_INFO}
      - TRAINING_SCHEDULE_TIMES=${TRAINING_SCHEDULE_TIMES}
      - TZ=Asia/Bangkok
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
